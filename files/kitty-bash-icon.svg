<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- flat square background, minimal rounding, brighter purple -->
  <rect x="8" y="8" width="240" height="240" rx="20" fill="#553199"/>

  <!-- border -->
  <rect x="8" y="8" width="240" height="240" rx="20" fill="none" stroke="#c8a8f7" stroke-opacity="0.7" stroke-width="3"/>

  <!-- terminal title bar -->
  <path d="M8 28 a20 20 0 0 1 20 -20 h200 a20 20 0 0 1 20 20 v22 h-240 z" fill="#382163"/>
  <line x1="8" y1="50" x2="248" y2="50" stroke="#c8a8f7" stroke-opacity="0.7" stroke-width="3"/>

  <!-- window control dots -->
  <circle cx="34" cy="29" r="9" fill="#dcc4fa"/>
  <circle cx="62" cy="29" r="9" fill="#dcc4fa"/>
  <circle cx="90" cy="29" r="9" fill="#dcc4fa"/>

  <!-- prompt symbol -->
  <text x="128" y="192" font-family="'JetBrains Mono','Fira Code',Consolas,monospace"
        font-size="140" font-weight="700" text-anchor="middle" fill="#ffffff">&gt;_</text>
</svg>
